<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speak N Spell 0.1a</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">
  <style type="text/css">
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Helvetica, Geneva, sans-serif;
      background-color: white;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    a {
      color: black;
    }

    /* Display Area: Handles Full-Center (no-split) vs Left/Right (has-split) */
    #displayArea {
      position: absolute;
      top: 4%;
      left: 0;
      width: 100%;
      height: 56%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4vw;
      transition: all 0.25s ease;
    }

    #displayArea.no-split {
      flex-direction: column;
    }

    #displayArea.no-split #wordContainer {
      width: 100%;
      text-align: center;
    }

    #displayArea.no-split #pictureContainer {
      display: none;
    }

    #displayArea.has-split {
      flex-direction: row;
    }

    #displayArea.has-split #wordContainer {
      width: 50%;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #displayArea.has-split #pictureContainer {
      width: 50%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #resultUpper {
      font-family: "Open Sans", sans-serif;
      font-weight: 700;
      line-height: 1.1;
      word-break: break-word;
      user-select: none;
      margin-bottom: 2vh;
    }

    #resultLower {
      font-family: "Open Sans", sans-serif;
      font-weight: 400;
      line-height: 1.1;
      color: darkblue;
      word-break: break-word;
      user-select: none;
    }

    #wordImage {
      max-width: 80%;
      max-height: 80%;
      width: clamp(140px, 28vw, 320px);
      height: clamp(140px, 28vw, 320px);
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.08));
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    /* Lower Controls Area */
    .centered {
      position: absolute;
      top: 64%;
      left: 50%;
      transform: translate(-50%, 0%);
      width: 90%;
      max-width: 600px;
      text-align: center;
      font-size: calc(1vw + 1vh + 4px);
    }

    .centered h1 {
      font-size: calc(1.6vw + 1.6vh + 8px);
      margin: 4px 0 8px 0;
    }

    #iconContainer {
      margin: 6px auto 10px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #speechToggle {
      font-size: clamp(3.2rem, 8vw, 4.8rem);
      background: transparent;
      border: none;
      cursor: pointer;
      line-height: 1;
      padding: 6px;
      user-select: none;
      -webkit-user-select: none;
      display: inline-block;
      outline: none;
    }

    #promptText {
      font-size: clamp(14px, 2.2vw, 19px);
      color: #333;
      margin-top: 4px;
      min-height: 24px;
    }

    /* Fallback input for keyboard typing */
    #textFallbackForm {
      margin-top: 10px;
      display: none;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    #manualWordInput {
      font-size: 15px;
      padding: 7px 14px;
      border: 1.5px solid #bbb;
      border-radius: 20px;
      outline: none;
      width: 65%;
      max-width: 250px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    #manualWordInput:focus {
      border-color: #1a73e8;
    }

    #manualSpellBtn {
      font-size: 14px;
      padding: 7px 16px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s;
    }

    #manualSpellBtn:hover {
      background: #1557b0;
    }

    /* Loading Overlay for Firefox Engine initialization */
    #loadingOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }

    .loadingCard {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 16px;
      padding: 28px 36px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      max-width: 380px;
      width: 88%;
    }

    .progressBarTrack {
      width: 100%;
      height: 8px;
      background: #eee;
      border-radius: 4px;
      overflow: hidden;
      margin: 16px 0 10px 0;
    }

    #progressBar {
      width: 5%;
      height: 100%;
      background: #1a73e8;
      border-radius: 4px;
      transition: width 0.2s ease;
    }

    @media (max-width: 768px) {
      .centered {
        top: 62%;
        width: 94%;
      }
    }

    .libleft {
      font-size: large;
      position: fixed;
      left: 10px;
      bottom: 10px;
    }

    #info {
      font-size: 11px;
      color: #666;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>
  <!-- Loading overlay for Firefox -->
  <div id="loadingOverlay">
    <div class="loadingCard">
      <div style="font-size: 3.5rem; margin-bottom: 8px;">🐵</div>
      <div style="font-size: 1.25rem; font-weight: bold; margin-bottom: 6px;">Setting Up Voice Mode</div>
      <div id="loadingStatus" style="font-size: 0.95rem; color: #555;">Loading speech engine for Firefox...</div>
      <div class="progressBarTrack">
        <div id="progressBar"></div>
      </div>
      <div style="font-size: 11px; color: #888;">Downloads once and caches locally (~39MB)</div>
      <button onclick="skipLoading()" style="background:none; border:none; color:#1a73e8; font-size:12px; margin-top:14px; cursor:pointer; text-decoration:underline;">Skip &amp; Type Word</button>
    </div>
  </div>

  <!-- Split display: Left = Word, Right = Icon. If no icon: Word is Centered (no split) -->
  <div id="displayArea" class="no-split">
    <div id="wordContainer">
      <div id="resultUpper">WONDERFUL</div>
      <div id="resultLower">wonderful</div>
    </div>
    <div id="pictureContainer">
      <img id="wordImage" alt="" style="display: none;">
    </div>
  </div>

  <div class="centered">
    <div id="iconContainer">
      <button id="speechToggle" onclick="handleIconClick()" aria-label="Toggle speech mode" title="Speech mode ON (listening) - Click to toggle">🐵</button>
    </div>
    <h1>Speak N Spell 0.1a</h1>
    <div id="promptText">Ask "How do you spell ______"?</div>

    <!-- Fallback Text Input -->
    <form id="textFallbackForm" onsubmit="handleManualSpell(event)">
      <input type="text" id="manualWordInput" placeholder="Type a word to spell..." autocomplete="off" autocapitalize="none" />
      <button type="submit" id="manualSpellBtn">Spell</button>
    </form>
  </div>

  <div class="libleft">
    <div id="info"></div>
    <span onclick="location.reload()" style="cursor: pointer;" title="Reload">👨‍💻</span> <a href="http://cwmoriarty.com">cwmoriarty.com</a>
    <div style="font-size: 10px; opacity: 0.6; margin-top: 4px;">Built 2026-10-29 03:32 UTC</div>
  </div>

  <script>
    // State management
    let isSpeechEnabled = true;
    let isRecognizing = false;
    let isSpeaking = false;
    let speechDetected = false;
    let resetIconTimer = null;
    let recognition = null;
    let voices = [];

    // Firefox continuous Voice Activity Detection (VAD) & Whisper state
    let whisperPipeline = null;
    let audioContext = null;
    let mediaStreamSource = null;
    let audioProcessor = null;
    let mediaStream = null;
    let isListeningFirefox = false;
    let isProcessingFirefox = false;
    let isSpeakingVoice = false;
    let speechBuffer = [];
    let silenceBuffers = 0;

    const displayArea = document.getElementById('displayArea');
    const wordImage = document.getElementById('wordImage');
    const speechToggle = document.getElementById('speechToggle');
    const promptText = document.getElementById('promptText');
    const textFallbackForm = document.getElementById('textFallbackForm');
    const manualWordInput = document.getElementById('manualWordInput');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingStatus = document.getElementById('loadingStatus');
    const progressBar = document.getElementById('progressBar');
    const upperEl = document.getElementById('resultUpper');
    const lowerEl = document.getElementById('resultLower');
    const infoEl = document.getElementById('info');

    // Dynamic Font Resizing based on available layout width
    function resizeElementText(element, targetWidth) {
      if (!element) return;
      const text = element.textContent || "";
      if (!text) return;

      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      const style = window.getComputedStyle(element);
      const baseFontSize = 100;
      context.font = `${baseFontSize}px ${style.fontFamily || 'Open Sans, sans-serif'}`;
      const textWidth = context.measureText(text).width || 1;
      const scaleFactor = targetWidth / textWidth;
      const newFontSize = Math.min(baseFontSize * scaleFactor, window.innerHeight * 0.20);
      element.style.fontSize = `${newFontSize}px`;
    }

    function resizeAll() {
      const isSplit = displayArea.classList.contains('has-split');
      const targetWidth = isSplit ? (window.innerWidth * 0.44) : (window.innerWidth * 0.88);
      resizeElementText(upperEl, targetWidth);
      resizeElementText(lowerEl, targetWidth);
    }

    // Run initially and on resize
    resizeAll();
    window.addEventListener('resize', resizeAll);

    // Layout Split Controller
    function setDisplayMode(hasIcon, imageUrl) {
      if (hasIcon && imageUrl) {
        wordImage.src = imageUrl;
        wordImage.style.display = 'block';
        displayArea.classList.remove('no-split');
        displayArea.classList.add('has-split');
      } else {
        wordImage.src = '';
        wordImage.style.display = 'none';
        displayArea.classList.remove('has-split');
        displayArea.classList.add('no-split');
      }
      resizeAll();
    }

    // Fallback if image fails to load
    wordImage.onerror = () => {
      console.warn("Failed to render icon image, reverting to center word layout");
      setDisplayMode(false);
    };

    // Icon search from Iconify API (Open, CORS-friendly icon finder)
    async function fetchIcon(word) {
      try {
        const query = encodeURIComponent(word.toLowerCase().trim());
        const res = await fetch(`https://api.iconify.design/search?query=${query}&limit=1`);
        if (res.ok) {
          const data = await res.json();
          if (data.icons && data.icons.length > 0) {
            const [prefix, name] = data.icons[0].split(':');
            return `https://api.iconify.design/${prefix}/${name}.svg?color=%231a73e8`;
          }
        }
      } catch (err) {
        console.warn("Icon search network error:", err);
      }
      return null;
    }

    // Text-to-Speech (supported in Firefox & Chrome)
    function loadVoices() {
      if ('speechSynthesis' in window) {
        voices = window.speechSynthesis.getVoices();
      }
    }

    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function TTS(text) {
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      if (!voices.length) {
        voices = window.speechSynthesis.getVoices();
      }

      const moiraVoice = voices.find(v => v.name && v.name.includes('Moira'));
      if (moiraVoice) utterance.voice = moiraVoice;

      utterance.volume = 0.75;
      utterance.rate = 0.75;
      utterance.pitch = 1.25;

      utterance.onstart = () => { isSpeaking = true; };
      utterance.onend = () => {
        isSpeaking = false;
        if (isSpeechEnabled && !isRecognizing && recognition) startRecognition();
      };
      utterance.onerror = () => {
        isSpeaking = false;
        if (isSpeechEnabled && !isRecognizing && recognition) startRecognition();
      };

      console.log("Speaking: " + text);
      window.speechSynthesis.speak(utterance);
    }

    // Profanity Filter: Fast local kid-safe check + Vector API fallback
    const LOCAL_PROFANITY = new Set([
      'poop', 'poopy', 'poopoo', 'pee', 'peeing', 'crap', 'crappy',
      'damn', 'hell', 'shit', 'fuck', 'fucking', 'bitch', 'ass',
      'asshole', 'bastard', 'dick', 'piss', 'cunt'
    ]);

    async function checkIsProfane(text) {
      const clean = text.toLowerCase().trim();
      if (LOCAL_PROFANITY.has(clean)) return true;

      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 1200);
        const res = await fetch('https://vector.profanity.dev', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: "Spell " + clean }),
          signal: controller.signal
        });
        clearTimeout(timeout);
        if (res.ok) {
          const data = await res.json();
          return !!data.isProfanity;
        }
      } catch (err) {
        console.warn('Profanity API lookup error:', err);
      }
      return false;
    }

    // Speech UI & Icon Management
    function setIcon(icon, promptMessage) {
      clearTimeout(resetIconTimer);
      if (!speechToggle) return;

      speechToggle.textContent = icon;

      if (icon === '🐵') {
        speechToggle.title = "Speech mode ON (listening) - Click to turn OFF";
        speechToggle.setAttribute('aria-label', 'Speech mode ON');
        if (promptText) {
          promptText.textContent = promptMessage || 'Ask "How do you spell ______"?';
        }
      } else if (icon === '🙊') {
        speechToggle.title = "Speech mode OFF - Click to turn ON";
        speechToggle.setAttribute('aria-label', 'Speech mode OFF');
        if (promptText) {
          promptText.textContent = promptMessage || 'Speech mode is OFF — click 🙊 to listen';
        }
      } else if (icon === '🙉') {
        speechToggle.title = "Didn't hear 'How do you spell...' - Try again!";
        speechToggle.setAttribute('aria-label', "Didn't match spelling command");
        if (promptText) {
          promptText.textContent = promptMessage || 'Didn\'t hear "How do you spell..." — try again! 👂';
        }

        resetIconTimer = setTimeout(() => {
          if (isSpeechEnabled) setIcon('🐵');
        }, 2500);
      }
    }

    // Process matched spelling word
    async function handleSpellingMatch(rawWord) {
      let word = rawWord.trim();

      // Replacement list for custom pronunciations/names
      const lower = word.toLowerCase();
      if (lower === "eva") word = "aoife";
      else if (lower === "megan") word = "meaghan";

      // Profanity verification: flagged words turn to "NO"
      const isBad = await checkIsProfane(word);
      if (isBad) {
        word = "NO";
        setDisplayMode(false);
        upperEl.textContent = "NO";
        lowerEl.textContent = "no";
        resizeAll();
        TTS("NO is spelled N, O.");
        return;
      }

      // Display spelling immediately
      upperEl.textContent = word.toUpperCase();
      lowerEl.textContent = word.toLowerCase();
      resizeAll();

      // Search for picture icon
      const iconUrl = await fetchIcon(word);
      setDisplayMode(!!iconUrl, iconUrl);

      // Pronounce letter-by-letter with slight pauses
      const spelledOut = word.split('').join(', ');
      TTS(word + " is spelled " + spelledOut);
    }

    // Manual Text Input Fallback
    function handleManualSpell(e) {
      if (e) e.preventDefault();
      const val = (manualWordInput.value || "").trim();
      if (!val) return;
      manualWordInput.value = "";
      manualWordInput.blur();
      handleSpellingMatch(val);
    }

    function skipLoading() {
      if (loadingOverlay) loadingOverlay.style.display = 'none';
      if (textFallbackForm) textFallbackForm.style.display = 'flex';
      if (manualWordInput) manualWordInput.focus();
    }

    // Click handler for speechToggle: toggles speech mode on/off
    function handleIconClick() {
      if (isSpeechEnabled) {
        isSpeechEnabled = false;
        setIcon('🙊');
        if (recognition) stopRecognition();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      } else {
        isSpeechEnabled = true;
        setIcon('🐵');
        infoEl.textContent = '';
        if (recognition) {
          startRecognition();
        } else if (!isListeningFirefox) {
          startFirefoxContinuousListening();
        }
      }
    }

    // Helper: concatenate float32 audio chunks
    function flattenFloat32Arrays(chunks) {
      let totalLength = 0;
      for (let i = 0; i < chunks.length; i++) totalLength += chunks[i].length;
      const flat = new Float32Array(totalLength);
      let offset = 0;
      for (let i = 0; i < chunks.length; i++) {
        flat.set(chunks[i], offset);
        offset += chunks[i].length;
      }
      return flat;
    }

    // Firefox continuous Voice Activity Detection (VAD)
    async function startFirefoxContinuousListening() {
      if (!isSpeechEnabled || isListeningFirefox) return;

      try {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        }
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }

        if (!mediaStream) {
          mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }

        mediaStreamSource = audioContext.createMediaStreamSource(mediaStream);
        audioProcessor = audioContext.createScriptProcessor(4096, 1, 1);

        audioProcessor.onaudioprocess = (e) => {
          if (!isSpeechEnabled || isSpeaking || isProcessingFirefox) {
            return;
          }

          const channel = e.inputBuffer.getChannelData(0);

          // Calculate RMS volume level
          let sumSquares = 0;
          for (let i = 0; i < channel.length; i++) {
            sumSquares += channel[i] * channel[i];
          }
          const rms = Math.sqrt(sumSquares / channel.length);

          if (rms > 0.016) {
            // Voice energy detected
            isSpeakingVoice = true;
            silenceBuffers = 0;
            speechBuffer.push(new Float32Array(channel));
          } else if (isSpeakingVoice) {
            // Silence trailing after speech
            speechBuffer.push(new Float32Array(channel));
            silenceBuffers++;

            // ~1 second of trailing silence (4 * 0.256s)
            if (silenceBuffers >= 4) {
              isSpeakingVoice = false;
              silenceBuffers = 0;
              const audioData = flattenFloat32Arrays(speechBuffer);
              speechBuffer = [];

              // If at least ~0.75 seconds of audio captured
              if (audioData.length >= 12000) {
                processFirefoxAudio(audioData);
              }
            }
          }
        };

        mediaStreamSource.connect(audioProcessor);
        audioProcessor.connect(audioContext.destination);
        isListeningFirefox = true;
        setIcon('🐵');
      } catch (err) {
        console.warn("Firefox continuous mic setup failed:", err);
        infoEl.textContent = "⚠️ Mic permission needed. Click 🐵 to allow.";
        textFallbackForm.style.display = 'flex';
      }
    }

    // Transcribe speech captured in Firefox via Whisper
    async function processFirefoxAudio(float32Data) {
      if (isProcessingFirefox) return;
      isProcessingFirefox = true;

      try {
        if (!whisperPipeline) {
          isProcessingFirefox = false;
          return;
        }

        const out = await whisperPipeline(float32Data);
        const transcript = (out && out.text) ? out.text.trim() : '';
        console.log("Firefox VAD transcript:", transcript);

        const regex = /how do you spell\s+([a-zA-Z\-]+)/i;
        const match = transcript.match(regex);

        if (match && match[1]) {
          setIcon('🐵');
          await handleSpellingMatch(match[1]);
        } else if (transcript.length > 0) {
          // If child said a word without "how do you spell"
          const cleanWord = transcript.replace(/[^a-zA-Z]/g, '');
          if (cleanWord.length > 1) {
            setIcon('🐵');
            await handleSpellingMatch(cleanWord);
          } else {
            console.log("Speech did not match command:", transcript);
            setIcon('🙉');
          }
        } else {
          setIcon('🙉');
        }
      } catch (err) {
        console.error("Whisper VAD processing error:", err);
        setIcon('🙉');
      } finally {
        isProcessingFirefox = false;
      }
    }

    // Initialize Firefox Whisper Engine by default
    async function initFirefoxWhisperEngine() {
      textFallbackForm.style.display = 'flex';
      loadingOverlay.style.display = 'flex';

      try {
        const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
        env.allowLocalModels = false;

        whisperPipeline = await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny.en', {
          progress_callback: (item) => {
            if (item.status === 'progress' && item.progress) {
              const pct = Math.round(item.progress);
              progressBar.style.width = pct + '%';
              loadingStatus.textContent = `Downloading model (${pct}%)...`;
            } else if (item.status === 'done') {
              loadingStatus.textContent = 'Voice engine ready!';
              progressBar.style.width = '100%';
            }
          }
        });

        // Hide loading screen and start continuous listening
        setTimeout(() => {
          loadingOverlay.style.display = 'none';
          promptText.textContent = 'Ask "How do you spell ______"?';
          startFirefoxContinuousListening();
        }, 400);

      } catch (err) {
        console.error("Failed to load Whisper in Firefox:", err);
        loadingOverlay.style.display = 'none';
        promptText.textContent = 'Ask "How do you spell ______" or type below:';
        infoEl.textContent = 'Firefox: Type words below or click 🐵 to retry mic.';
      }
    }

    // Speech Recognition Setup: Native Web Speech API (Chrome/Safari) vs Whisper (Firefox)
    const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognitionAPI) {
      // Firefox: Load Whisper by default and show loading screen
      initFirefoxWhisperEngine();
    } else {
      // Chrome / Safari / Thorium / Edge: Native instant Web Speech API
      recognition = new SpeechRecognitionAPI();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isRecognizing = true;
        console.log("Speech recognition active");
      };

      recognition.onspeechstart = () => { speechDetected = true; };
      recognition.onsoundstart = () => { speechDetected = true; };

      recognition.onresult = (event) => {
        if (isSpeaking) return;

        const lastResult = event.results[event.results.length - 1];
        if (!lastResult || !lastResult[0]) return;

        const transcript = lastResult[0].transcript.trim();
        console.log("Heard transcript:", transcript);

        const regex = /how do you spell\s+([a-zA-Z\-]+)/i;
        const match = transcript.match(regex);

        if (match && match[1]) {
          speechDetected = false;
          setIcon('🐵');
          handleSpellingMatch(match[1]);
        } else {
          speechDetected = false;
          console.log("Speech did not match spelling command:", transcript);
          setIcon('🙉');
        }
      };

      recognition.onnomatch = () => {
        if (isSpeaking) return;
        speechDetected = false;
        console.log("Audio detected with no match");
        setIcon('🙉');
      };

      recognition.onerror = (event) => {
        console.warn("Speech recognition error:", event.error);
        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
          isSpeechEnabled = false;
          isRecognizing = false;
          setIcon('🙊');
          infoEl.textContent = "⚠️ Microphone access blocked. Click 🙊 or type below.";
          textFallbackForm.style.display = 'flex';
        }
      };

      recognition.onend = () => {
        isRecognizing = false;
        console.log("Speech recognition ended");

        if (speechDetected && !isSpeaking && isSpeechEnabled) {
          speechDetected = false;
          setIcon('🙉');
        }

        if (isSpeechEnabled && !isSpeaking) {
          setTimeout(() => {
            if (isSpeechEnabled && !isRecognizing && !isSpeaking) {
              startRecognition();
            }
          }, 300);
        }
      };

      startRecognition();
    }

    function startRecognition() {
      if (!recognition || !isSpeechEnabled || isRecognizing) return;
      try {
        recognition.start();
      } catch (err) {
        console.warn("startRecognition caught error:", err);
      }
    }

    function stopRecognition() {
      if (!recognition) return;
      isRecognizing = false;
      try {
        recognition.stop();
      } catch (err) {
        console.warn("stopRecognition caught error:", err);
      }
    }
  </script>
</body>

</html>
