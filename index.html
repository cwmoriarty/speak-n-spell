<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speak N Spell 0.1a</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">
  <style type="text/css">
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Helvetica, Geneva, sans-serif;
      background-color: white;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    a {
      color: black;
    }

    #resultUpper {
      font-family: "Open Sans", sans-serif;
      font-size: 15vw;
      width: 100%;
      top: 8%;
      position: absolute;
      text-align: center;
      line-height: 1.1;
      word-break: break-word;
      user-select: none;
    }

    #resultLower {
      font-family: "Open Sans", sans-serif;
      font-size: 13vw;
      width: 100%;
      top: 36%;
      position: absolute;
      text-align: center;
      color: darkblue;
      line-height: 1.1;
      word-break: break-word;
      user-select: none;
    }

    .centered {
      position: absolute;
      top: 65%;
      left: 50%;
      transform: translate(-50%, 0%);
      width: 90%;
      max-width: 600px;
      text-align: center;
      font-size: calc(1vw + 1vh + 4px);
    }

    .centered h1 {
      font-size: calc(1.6vw + 1.6vh + 8px);
      margin: 4px 0 8px 0;
    }

    #iconContainer {
      margin: 8px auto 12px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #speechToggle {
      font-size: clamp(3.2rem, 8vw, 4.8rem);
      background: transparent;
      border: none;
      cursor: pointer;
      line-height: 1;
      padding: 6px;
      border-radius: 50%;
      user-select: none;
      -webkit-user-select: none;
      display: inline-block;
      transition: transform 0.15s ease, background-color 0.2s ease;
      outline: none;
    }

    #speechToggle:hover {
      transform: scale(1.15);
      background-color: rgba(0, 0, 0, 0.04);
    }

    #speechToggle:active {
      transform: scale(0.92);
    }

    #speechToggle.listening {
      animation: gentle-pulse 2s infinite ease-in-out;
    }

    @keyframes gentle-pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
    }

    #promptText {
      font-size: clamp(14px, 2.2vw, 20px);
      color: #333;
      margin-top: 4px;
      min-height: 24px;
    }

    @media (max-width: 768px) {
      .centered {
        top: 63%;
        width: 94%;
      }
      #resultUpper {
        top: 6%;
      }
      #resultLower {
        top: 34%;
      }
    }

    .libleft {
      font-size: large;
      position: fixed;
      left: 10px;
      bottom: 10px;
    }

    #info {
      font-size: 12px;
      color: #c00;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>
  <div id="resultUpper">WONDERFUL</div>
  <div id="resultLower">wonderful</div>

  <div class="centered">
    <div id="iconContainer">
      <button id="speechToggle" onclick="toggleSpeechMode()" aria-label="Toggle speech mode" title="Speech mode ON (listening) - Click to turn OFF">🐵</button>
    </div>
    <h1>Speak N Spell 0.1a</h1>
    <div id="promptText">Ask "How do you spell ______"?</div>
  </div>

  <div class="libleft">
    <div id="info"></div>
    <span onclick="location.reload()" style="cursor: pointer;" title="Reload">👨‍💻</span> <a href="http://cwmoriarty.com">cwmoriarty.com</a>
    <div style="font-size: 10px; opacity: 0.6; margin-top: 4px;">Built 2026-10-29 03:08 UTC</div>
  </div>

  <script>
    // State management
    let isSpeechEnabled = true;
    let isRecognizing = false;
    let isSpeaking = false;
    let speechDetected = false;
    let resetIconTimer = null;
    let recognition = null;
    let voices = [];

    const speechToggle = document.getElementById('speechToggle');
    const promptText = document.getElementById('promptText');
    const upperEl = document.getElementById('resultUpper');
    const lowerEl = document.getElementById('resultLower');
    const infoEl = document.getElementById('info');

    // Font resizing
    function resizeElementTextToWindow(element) {
      if (!element) return;
      const word = element.textContent || "WONDERFUL";
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      const style = window.getComputedStyle(element);
      const baseFontSize = 100;
      context.font = `${baseFontSize}px ${style.fontFamily || 'Open Sans, sans-serif'}`;
      const textWidth = context.measureText(word).width || 1;
      const targetWidth = window.innerWidth * 0.88;
      const scaleFactor = targetWidth / textWidth;
      const newFontSize = Math.min(baseFontSize * scaleFactor, window.innerHeight * 0.22);
      element.style.fontSize = `${newFontSize}px`;
    }

    function resizeAll() {
      resizeElementTextToWindow(upperEl);
      resizeElementTextToWindow(lowerEl);
    }

    // Run initially and on resize
    resizeAll();
    window.addEventListener('resize', resizeAll);

    // Text-to-Speech
    function loadVoices() {
      if ('speechSynthesis' in window) {
        voices = window.speechSynthesis.getVoices();
      }
    }

    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function TTS(text) {
      if (!('speechSynthesis' in window)) {
        console.warn('Speech synthesis not supported in this browser.');
        return;
      }

      window.speechSynthesis.cancel(); // Stop any pending speech

      const utterance = new SpeechSynthesisUtterance(text);
      if (!voices.length) {
        voices = window.speechSynthesis.getVoices();
      }

      const moiraVoice = voices.find(v => v.name && v.name.includes('Moira'));
      if (moiraVoice) {
        utterance.voice = moiraVoice;
      }

      utterance.volume = 0.75;
      utterance.rate = 0.75;
      utterance.pitch = 1.25;

      utterance.onstart = () => {
        isSpeaking = true;
      };

      utterance.onend = () => {
        isSpeaking = false;
        // Resume listening safely after TTS completes
        if (isSpeechEnabled && !isRecognizing) {
          startRecognition();
        }
      };

      utterance.onerror = (e) => {
        console.warn('TTS error:', e);
        isSpeaking = false;
        if (isSpeechEnabled && !isRecognizing) {
          startRecognition();
        }
      };

      console.log("Speaking: " + text);
      window.speechSynthesis.speak(utterance);
    }

    // Profanity Filter
    async function checkProfanity(text) {
      try {
        const response = await fetch('https://vector.profanity.dev', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: "Spell " + text })
        });
        if (response.ok) {
          const data = await response.json();
          return data.isProfanity ? "LANGUAGE" : text;
        }
      } catch (err) {
        console.warn('Profanity API lookup failed:', err);
      }
      return text;
    }

    // Speech UI & Icon Management
    function setIcon(icon, promptMessage) {
      clearTimeout(resetIconTimer);
      if (!speechToggle) return;

      speechToggle.textContent = icon;

      if (icon === '🐵') {
        speechToggle.className = 'listening';
        speechToggle.title = "Speech mode ON (listening) - Click to turn OFF";
        speechToggle.setAttribute('aria-label', 'Speech mode ON');
        if (promptText) {
          promptText.textContent = promptMessage || 'Ask "How do you spell ______"?';
        }
      } else if (icon === '🙊') {
        speechToggle.className = '';
        speechToggle.title = "Speech mode OFF - Click to turn ON";
        speechToggle.setAttribute('aria-label', 'Speech mode OFF');
        if (promptText) {
          promptText.textContent = promptMessage || 'Speech mode is OFF — click 🙊 to listen';
        }
      } else if (icon === '🙉') {
        speechToggle.className = '';
        speechToggle.title = "Didn't hear 'How do you spell...' - Try again!";
        speechToggle.setAttribute('aria-label', "Didn't match spelling command");
        if (promptText) {
          promptText.textContent = promptMessage || 'Didn\'t hear "How do you spell..." — try again! 👂';
        }

        // Return to 🐵 after 2.5 seconds if speech mode is still enabled
        resetIconTimer = setTimeout(() => {
          if (isSpeechEnabled) {
            setIcon('🐵');
          }
        }, 2500);
      }
    }

    // Speech Mode Toggle
    function toggleSpeechMode() {
      if (isSpeechEnabled) {
        // Toggle OFF
        isSpeechEnabled = false;
        setIcon('🙊');
        stopRecognition();
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      } else {
        // Toggle ON
        isSpeechEnabled = true;
        setIcon('🐵');
        infoEl.textContent = '';
        startRecognition();
      }
    }

    // Process matched spelling word
    async function handleSpellingMatch(rawWord) {
      let word = rawWord.trim();

      // Custom replacement list
      const lower = word.toLowerCase();
      if (lower === "eva") { word = "aoife"; }
      else if (lower === "megan") { word = "meaghan"; }
      else if (lower === "poopy") { word = "NO"; }

      // Profanity verification
      word = await checkProfanity(word);

      // Display spelling
      upperEl.textContent = word.toUpperCase();
      lowerEl.textContent = word.toLowerCase();
      resizeAll();

      // Pronounce letter-by-letter with slight pauses
      const spelledOut = word.split('').join(', ');
      TTS(word + " is spelled " + spelledOut);
    }

    // Speech Recognition Setup
    const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognitionAPI) {
      infoEl.textContent = "⚠️ Speech Recognition not supported in this browser.";
      setIcon('🙊', 'Speech recognition unsupported');
      isSpeechEnabled = false;
    } else {
      recognition = new SpeechRecognitionAPI();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isRecognizing = true;
        console.log("Speech recognition active");
      };

      recognition.onspeechstart = () => {
        speechDetected = true;
      };

      recognition.onsoundstart = () => {
        speechDetected = true;
      };

      recognition.onresult = (event) => {
        if (isSpeaking) {
          // Ignore microphone audio while TTS is actively speaking
          return;
        }

        const lastResult = event.results[event.results.length - 1];
        if (!lastResult || !lastResult[0]) return;

        const transcript = lastResult[0].transcript.trim();
        console.log("Heard transcript:", transcript);

        const regex = /how do you spell\s+([a-zA-Z\-]+)/i;
        const match = transcript.match(regex);

        if (match && match[1]) {
          // Matched!
          speechDetected = false;
          setIcon('🐵');
          handleSpellingMatch(match[1]);
        } else {
          // Stream of audio came in but did NOT match "how do you spell ____"
          speechDetected = false;
          console.log("Speech did not match spelling command:", transcript);
          setIcon('🙉');
        }
      };

      recognition.onnomatch = () => {
        if (isSpeaking) return;
        speechDetected = false;
        console.log("Audio detected with no match");
        setIcon('🙉');
      };

      recognition.onerror = (event) => {
        console.warn("Speech recognition error:", event.error);
        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
          isSpeechEnabled = false;
          isRecognizing = false;
          setIcon('🙊');
          infoEl.textContent = "⚠️ Microphone access blocked. Click 🙊 to grant access and retry.";
        }
      };

      recognition.onend = () => {
        isRecognizing = false;
        console.log("Speech recognition ended");

        // If speech was detected in this session but produced no match result
        if (speechDetected && !isSpeaking && isSpeechEnabled) {
          speechDetected = false;
          setIcon('🙉');
        }

        // Automatically restart if speech mode remains enabled
        if (isSpeechEnabled && !isSpeaking) {
          setTimeout(() => {
            if (isSpeechEnabled && !isRecognizing && !isSpeaking) {
              startRecognition();
            }
          }, 300);
        }
      };

      // Start recognition initially
      startRecognition();
    }

    function startRecognition() {
      if (!recognition || !isSpeechEnabled || isRecognizing) return;
      try {
        recognition.start();
      } catch (err) {
        // If already started or browser is busy, ignore
        console.warn("startRecognition caught error:", err);
      }
    }

    function stopRecognition() {
      if (!recognition) return;
      isRecognizing = false;
      try {
        recognition.stop();
      } catch (err) {
        console.warn("stopRecognition caught error:", err);
      }
    }
  </script>
</body>

</html>
