<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Speak N Spell 0.2a</title>
  <meta name="description" content="Voice-controlled spelling tutor and picture dictionary for kids.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#276738">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style type="text/css">
    :root {
      --bg: #faf8f4;
      --surface: #ffffff;
      --surface-raised: #f1ede5;
      --border: rgba(31, 27, 22, 0.10);
      --border-strong: rgba(31, 27, 22, 0.22);
      --text-primary: #1f1b16;
      --text-secondary: #5e554a;
      --text-muted: #756b5e;
      --text-lowercase: #1e3a6d;
      --accent: #276738;
      --accent-hover: #1e522c;
      --accent-soft: rgba(39, 103, 56, 0.10);
      --accent-border: rgba(39, 103, 56, 0.35);
      --danger: #b91c1c;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --shadow-sm: 0 1px 2px rgba(31, 27, 22, 0.05);
      --shadow-md: 0 8px 24px rgba(31, 27, 22, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 150ms var(--ease);
    }

    a:hover {
      color: var(--text-primary);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    button:focus-visible,
    a:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Top Controls */
    .top-controls {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 100;
    }

    .control-btn {
      height: 36px;
      padding: 0 12px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      user-select: none;
      -webkit-user-select: none;
      box-shadow: var(--shadow-sm);
      transition: background-color 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease), transform 120ms var(--ease);
      touch-action: manipulation;
    }

    .control-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .control-btn:hover {
      background-color: var(--surface-raised);
      border-color: var(--border-strong);
      color: var(--text-primary);
    }

    .control-btn:active {
      transform: scale(0.97);
    }

    .control-btn.active {
      border-color: var(--accent-border);
      color: var(--accent);
      background-color: var(--accent-soft);
    }

    /* Display Area: Center (no-split) vs 2/3 Words + 1/3 Card (has-split) */
    #displayArea {
      position: absolute;
      top: 64px;
      left: 0;
      width: 100%;
      height: calc(56vh - 64px);
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 32px;
    }

    #displayArea.no-split {
      flex-direction: column;
    }

    #displayArea.no-split #wordContainer {
      width: 100%;
      height: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #displayArea.no-split #pictureContainer {
      display: none;
    }

    #displayArea.has-split {
      flex-direction: row;
      gap: 24px;
    }

    /* Words occupy ~2/3rds of horizontal space */
    #displayArea.has-split #wordContainer {
      width: 66.666%;
      height: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    /* Framed picture flashcard occupies remaining 1/3rd */
    #displayArea.has-split #pictureContainer {
      width: 33.333%;
      max-width: 340px;
      height: 82%;
      max-height: 340px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: border-color 150ms var(--ease), transform 150ms var(--ease);
    }

    #displayArea.has-split #pictureContainer:hover {
      border-color: var(--border-strong);
    }

    #displayArea.has-split #pictureContainer:active {
      transform: scale(0.98);
    }

    #wordContainer {
      user-select: text;
      -webkit-user-select: text;
    }

    #resultUpper {
      font-family: "Open Sans", sans-serif;
      font-weight: 600;
      line-height: 1.05;
      color: var(--text-primary);
      white-space: nowrap;
      word-break: normal;
      overflow: visible;
      user-select: text;
      -webkit-user-select: text;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: text;
    }

    #resultLower {
      font-family: "Open Sans", sans-serif;
      font-weight: 400;
      line-height: 1.08;
      color: var(--text-lowercase);
      white-space: nowrap;
      word-break: normal;
      overflow: visible;
      user-select: text;
      -webkit-user-select: text;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: text;
    }

    .letter-glyph {
      display: inline-block;
      padding-bottom: 4px;
      border-bottom: 3px solid transparent;
      transition: transform 150ms var(--ease), color 150ms var(--ease), border-color 150ms var(--ease);
      transform-origin: center bottom;
    }

    .letter-glyph.highlighted-letter {
      transform: translateY(-4px) scale(1.10);
      color: var(--accent) !important;
      border-bottom-color: var(--accent);
    }

    .word-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 8px;
    }

    #syllablesDisplay {
      font-size: clamp(14px, 1.6vw, 18px);
      color: var(--text-secondary);
      letter-spacing: 0.06em;
      font-weight: 500;
      user-select: text;
      -webkit-user-select: text;
    }

    #lookupLink {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 6px;
      transition: background-color 150ms var(--ease), color 150ms var(--ease);
    }

    #lookupLink:hover {
      background-color: var(--surface-raised);
      color: var(--text-primary);
      text-decoration: none;
    }

    #lookupLink svg {
      width: 14px;
      height: 14px;
    }

    #wordImage {
      max-width: 100%;
      max-height: 100%;
      width: clamp(112px, 20vw, 240px);
      height: clamp(112px, 20vw, 240px);
      object-fit: contain;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
    }

    /* Lower Controls / Brand Area */
    .centered {
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translate(-50%, 0);
      width: 92%;
      max-width: 560px;
      text-align: center;
      transition: opacity 220ms var(--ease), transform 220ms var(--ease);
    }

    #brandHeader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #appTitle {
      font-size: clamp(24px, 2.8vw, 36px);
      font-weight: 600;
      line-height: 1.15;
      margin: 0;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }

    #iconContainer {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #speechToggle {
      font-size: clamp(48px, 7vw, 68px);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 16px;
      cursor: pointer;
      line-height: 1;
      padding: 8px;
      user-select: none;
      -webkit-user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 150ms var(--ease), border-color 150ms var(--ease), transform 120ms var(--ease);
    }

    #speechToggle:hover {
      background-color: var(--surface-raised);
      border-color: var(--border);
    }

    #speechToggle:active {
      transform: scale(0.96);
    }

    #promptText {
      font-size: clamp(14px, 1.8vw, 18px);
      color: var(--text-secondary);
      margin-top: 8px;
      min-height: 24px;
    }

    #promptText.status-error {
      color: var(--danger);
    }

    /* Active UI Mode: Once user spells their first word, anchor brand to lower-left */
    body.has-spelled #displayArea {
      height: calc(74vh - 64px);
    }

    body.has-spelled .centered {
      top: auto;
      bottom: 64px;
      left: 16px;
      transform: none;
      width: auto;
      max-width: calc(100vw - 32px);
      text-align: left;
    }

    body.has-spelled #brandHeader {
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
    }

    body.has-spelled #speechToggle {
      font-size: 32px;
      padding: 4px;
      border-radius: 8px;
    }

    body.has-spelled #appTitle {
      font-size: 18px;
      font-weight: 600;
      white-space: nowrap;
    }

    body.has-spelled #promptText {
      font-size: 13px;
      margin-top: 4px;
      min-height: 20px;
      text-align: left;
    }

    /* Footer Meta */
    .libleft {
      position: fixed;
      left: 16px;
      bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 50;
    }

    #info {
      font-size: 12px;
      color: var(--danger);
      min-height: 16px;
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .reload-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      padding: 0;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      transition: background-color 150ms var(--ease), color 150ms var(--ease);
    }

    .reload-btn:hover {
      background-color: var(--surface-raised);
      color: var(--text-primary);
    }

    .reload-btn svg {
      width: 14px;
      height: 14px;
    }

    .build-meta {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 16px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* Loading Overlay for Firefox / Whisper Engine */
    #loadingOverlay {
      position: fixed;
      inset: 0;
      background: rgba(250, 248, 244, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 16px;
    }

    .loadingCard {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 32px;
      text-align: center;
      box-shadow: var(--shadow-md);
      max-width: 380px;
      width: 100%;
    }

    .loading-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    #loadingStatus {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .progressBarTrack {
      width: 100%;
      height: 8px;
      background: var(--surface-raised);
      border-radius: 4px;
      overflow: hidden;
      margin: 16px 0 12px 0;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 220ms var(--ease);
    }

    #loadingSubtext {
      font-size: 12px;
      color: var(--text-muted);
    }

    #startMicBtn {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 40px;
      margin: 16px auto 0 auto;
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 150ms var(--ease), transform 120ms var(--ease);
    }

    #startMicBtn:hover {
      background: var(--accent-hover);
    }

    #startMicBtn:active {
      transform: scale(0.97);
    }

    #startMicBtn svg {
      width: 16px;
      height: 16px;
    }

    @media (max-width: 768px) {
      #displayArea {
        padding: 0 16px;
      }

      #displayArea.has-split {
        flex-direction: column;
        justify-content: center;
        gap: 16px;
      }

      #displayArea.has-split #wordContainer {
        width: 100%;
        height: auto;
        flex: 0 1 auto;
      }

      #displayArea.has-split #pictureContainer {
        width: auto;
        height: auto;
        max-width: 180px;
        max-height: 160px;
        padding: 16px;
      }

      #displayArea.has-split #wordImage {
        width: clamp(80px, 16vh, 128px);
        height: clamp(80px, 16vh, 128px);
      }

      body.has-spelled #displayArea {
        height: calc(72vh - 64px);
      }

      body.has-spelled .centered {
        bottom: 68px;
        left: 16px;
      }
    }

    @media (max-width: 600px) {
      .control-btn .btn-text {
        display: none;
      }

      .control-btn {
        width: 40px;
        height: 40px;
        padding: 0;
        justify-content: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <!-- Top controls: Repeat, Speed, Phonics & Fullscreen -->
  <div class="top-controls">
    <button id="repeatBtn" class="control-btn" onclick="handleRepeatClick()" aria-label="Repeat spelling" title="Repeat spelling">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
      <span class="btn-text">Repeat</span>
    </button>
    <button id="speedBtn" class="control-btn" onclick="toggleSpeechRate()" aria-label="Spelling speed: Normal" title="Spelling speed: Normal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m12 14 4-4"/>
        <path d="M3.34 19a10 10 0 1 1 17.32 0"/>
      </svg>
      <span id="speedLabel" class="btn-text">Normal</span>
    </button>
    <button id="phonicsBtn" class="control-btn" onclick="togglePhonicsMode()" aria-label="Mode: Letters" title="Mode: Letter names (select for Phonics)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
      <span id="phonicsLabel" class="btn-text">Letters</span>
    </button>
    <button id="fullscreenBtn" class="control-btn" onclick="toggleFullscreen()" aria-label="Toggle full screen" title="Toggle full screen">
      <svg id="fullscreenIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 3 21 3 21 9"/>
        <polyline points="9 21 3 21 3 15"/>
        <line x1="21" y1="3" x2="14" y2="10"/>
        <line x1="3" y1="21" x2="10" y2="14"/>
      </svg>
      <span id="fullscreenLabel" class="btn-text">Fullscreen</span>
    </button>
  </div>

  <!-- Loading overlay for Firefox / Whisper fallback -->
  <div id="loadingOverlay">
    <div class="loadingCard">
      <div class="loading-title">Setting up voice mode</div>
      <div id="loadingStatus">Downloading speech engine...</div>
      <div class="progressBarTrack">
        <div id="progressBar"></div>
      </div>
      <div id="loadingSubtext">Downloads once and caches locally (~40 MB)</div>
      <button id="startMicBtn" onclick="enableFirefoxMic()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
        <span>Start listening</span>
      </button>
    </div>
  </div>

  <!-- Split display: Left = Word (2/3rds), Right = Card (1/3rd). If no icon: Word is Centered -->
  <div id="displayArea" class="no-split">
    <div id="wordContainer">
      <div id="resultUpper">WONDERFUL</div>
      <div id="resultLower">wonderful</div>
      <div class="word-meta">
        <div id="syllablesDisplay" title="Syllable breakdown">won · der · ful</div>
        <a id="lookupLink" href="https://en.wikipedia.org/wiki/Wonderful" target="_blank" rel="noopener noreferrer">
          <span id="lookupLabel">Wikipedia</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </a>
      </div>
    </div>
    <div id="pictureContainer" onclick="handlePictureClick()" role="link" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();handlePictureClick();}">
      <img id="wordImage" alt="" style="display: none;">
    </div>
  </div>

  <div class="centered">
    <div id="brandHeader">
      <div id="iconContainer">
        <button id="speechToggle" onclick="handleIconClick()" aria-label="Speech mode ON" title="Speech mode ON — click to turn off">🐵</button>
      </div>
      <h1 id="appTitle">Speak N Spell 0.2a</h1>
    </div>
    <div id="promptText">Say "Spell ______"</div>
  </div>

  <div class="libleft">
    <div id="info"></div>
    <div class="footer-links">
      <button class="reload-btn" onclick="location.reload()" aria-label="Reload page" title="Reload page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
        </svg>
      </button>
      <a href="https://cwmoriarty.com">cwmoriarty.com</a>
    </div>
    <div class="build-meta">Built 2026-11-23 00:04 EST</div>
  </div>

  <script>
    // State management
    let isSpeechEnabled = true;
    let isRecognizing = false;
    let isSpeaking = false;
    let speechDetected = false;
    let resetIconTimer = null;
    let recognition = null;
    let voices = [];

    // Audio / Speech locking & sequence tokens to prevent self-speech echo & async race conditions
    let activeUtterance = null;
    let speechCooldownTimer = null;
    let speechWatchdogTimer = null;
    let speechPlaybackSeq = 0;
    let spellingMatchSeq = 0;

    // Firefox continuous Voice Activity Detection (VAD) & Whisper state
    let whisperPipeline = null;
    let audioContext = null;
    let mediaStreamSource = null;
    let audioProcessor = null;
    let mediaStream = null;
    let isListeningFirefox = false;
    let isProcessingFirefox = false;
    let isSpeakingVoice = false;
    let speechBuffer = [];
    let preSpeechRingBuffer = [];
    let silenceBuffers = 0;

    const displayArea = document.getElementById('displayArea');
    const wordImage = document.getElementById('wordImage');
    const speechToggle = document.getElementById('speechToggle');
    const promptText = document.getElementById('promptText');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingStatus = document.getElementById('loadingStatus');
    const progressBar = document.getElementById('progressBar');
    const startMicBtn = document.getElementById('startMicBtn');
    const upperEl = document.getElementById('resultUpper');
    const lowerEl = document.getElementById('resultLower');
    const infoEl = document.getElementById('info');
    const lookupLink = document.getElementById('lookupLink');
    const lookupLabel = document.getElementById('lookupLabel');

    // External Reference Link (Wikipedia if page exists, else dict.org)
    let currentWord = "wonderful";
    let currentDestinationUrl = "https://en.wikipedia.org/wiki/Wonderful";

    async function updateDestinationUrl(word) {
      if (!word) {
        currentDestinationUrl = "";
        updateLinkUI();
        return;
      }
      currentWord = word.trim();
      const wikiSlug = encodeURIComponent(currentWord.replace(/\s+/g, '_'));
      const dictUrl = `https://dict.org/bin/Dict?Form=Dict1&Query=${encodeURIComponent(currentWord)}&Strategy=*&Database=*`;

        const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${wikiSlug}`);
        if (res.ok) {

      if (!isWakeLockEnabled || document.visibilityState !== 'visible') return false;

      if ('wakeLock' in navigator && navigator.wakeLock && typeof navigator.wakeLock.request === 'function') {
        try {
          if (wakeLockSentinel && !wakeLockSentinel.released) return true;
          wakeLockSentinel = await navigator.wakeLock.request('screen');
          wakeLockSentinel.addEventListener('release', () => {
            wakeLockSentinel = null;
          });
          return true;
        } catch (err) {
          return false;
        }
      } else if ('requestWakeLock' in navigator) {
        try {
          wakeLockSentinel = navigator.requestWakeLock('screen');
          return true;
        } catch (err) {}
      }
      return false;

    // Dynamic Font Resizing: word fits available width cleanly without wrapping
    const textMeasureCanvas = document.createElement('canvas');

    function resizeElementText(element, targetWidth, isMobileSplit = false) {
      if (!element) return;
      const text = element.textContent || "";
      if (!text) return;

      const context = textMeasureCanvas.getContext('2d');
      const style = window.getComputedStyle(element);
      const baseFontSize = 100;
      const fontWeight = style.fontWeight || (element === upperEl ? '600' : '400');
      const fontFamily = style.fontFamily || 'Open Sans, sans-serif';
      context.font = `${fontWeight} ${baseFontSize}px ${fontFamily}`;
      const textWidth = context.measureText(text).width || 1;
      const scaleFactor = targetWidth / textWidth;
      let newFontSize = baseFontSize * scaleFactor;

      const maxFontHeight = isMobileSplit ? (window.innerHeight * 0.16) : (window.innerHeight * 0.21);
      newFontSize = Math.min(newFontSize, maxFontHeight);
      element.style.fontSize = `${newFontSize}px`;

      if (element.scrollWidth > targetWidth) {
        const adjust = targetWidth / element.scrollWidth;
        element.style.fontSize = `${newFontSize * adjust}px`;
      }
    }

      const isMobile = vw <= 768;
      const targetWidth = (isSplit && !isMobile)

        : (vw - 32);
      resizeElementText(upperEl, targetWidth, isMobile && isSplit);
      resizeElementText(lowerEl, targetWidth, isMobile && isSplit);

    // Vector Clipart & Illustration Search (Iconify + Wikipedia Thumbnail fallback)
    async function fetchIcon(word) {
      try {
        const cleanWord = word.trim();
        const query = encodeURIComponent(cleanWord.toLowerCase());
        const queryHyphen = encodeURIComponent(cleanWord.toLowerCase().replace(/\s+/g, '-'));

        const clipartPrefixes = "fluent-emoji-flat,openmoji,twemoji,noto";
        let res = await fetch(`https://api.iconify.design/search?query=${query}&prefixes=${clipartPrefixes}&limit=12`);
        if (res.ok) {
          const data = await res.json();
          if (data.icons && data.icons.length > 0) {
            const [prefix, name] = data.icons[0].split(':');
            return `https://api.iconify.design/${prefix}/${name}.svg`;
          }
        }

        if (cleanWord.includes(' ')) {
          res = await fetch(`https://api.iconify.design/search?query=${queryHyphen}&prefixes=${clipartPrefixes}&limit=12`);
          if (res.ok) {
            const data = await res.json();
            if (data.icons && data.icons.length > 0) {
              const [prefix, name] = data.icons[0].split(':');
              return `https://api.iconify.design/${prefix}/${name}.svg`;
            }
          }
        }

        res = await fetch(`https://api.iconify.design/search?query=${query}&limit=20`);
        if (res.ok) {
          const data = await res.json();
          if (data.icons && data.icons.length > 0) {
            const [prefix, name] = data.icons[0].split(':');
            return `https://api.iconify.design/${prefix}/${name}.svg`;
          }
        }

        const wikiQuery = encodeURIComponent(cleanWord.replace(/\s+/g, '_'));
        res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${wikiQuery}`);
        if (res.ok) {
          const data = await res.json();
          if (data.thumbnail && data.thumbnail.source) {
            return data.thumbnail.source;
          }
        }
      } catch (err) {
        console.warn("Icon/clipart search network error:", err);
      }
      return null;
    }

    function getBestVoice() {
      if (!voices.length && 'speechSynthesis' in window) {
        voices = window.speechSynthesis.getVoices();
      }
      if (!voices.length) return null;

      const isEnglish = (v) => !v.lang || v.lang.toLowerCase().startsWith('en');

      const edgeNatural = voices.find(v => isEnglish(v) && (v.name.includes('Online (Natural)') || (v.name.includes('Natural') && v.name.includes('Microsoft'))));
      if (edgeNatural) return edgeNatural;

      const appleEnhanced = voices.find(v => isEnglish(v) && (v.name.includes('(Enhanced)') || v.name.includes('(Premium)') || v.name.includes('Siri')));
      if (appleEnhanced) return appleEnhanced;

      const googleVoice = voices.find(v => isEnglish(v) && v.name.includes('Google US English'));
      if (googleVoice) return googleVoice;

      const preferredNames = ['Jenny', 'Aria', 'Ava', 'Samantha', 'Allison', 'Daniel', 'Karen', 'Moira'];
      for (const name of preferredNames) {
        const found = voices.find(v => isEnglish(v) && v.name.includes(name));
        if (found) return found;
      }

      const usVoice = voices.find(v => v.lang === 'en-US' || v.lang === 'en_US');
      if (usVoice) return usVoice;

      return voices.find(isEnglish) || null;
    }

    function playTone(ctx, freq, startOffset, duration, type = 'sine', peakGain = 0.14) {
      try {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const now = ctx.currentTime + startOffset;
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(peakGain, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.03);
      } catch (e) {}
    }

    function playEarcon(type) {
      const ctx = getSoundAudioContext();
      if (!ctx) return;
      try {
        if (type === 'match') {
          playTone(ctx, 523.25, 0.00, 0.10, 'sine', 0.12);
          playTone(ctx, 659.25, 0.08, 0.10, 'sine', 0.12);
          playTone(ctx, 783.99, 0.16, 0.14, 'sine', 0.14);
        } else if (type === 'toggle') {
          playTone(ctx, 587.33, 0.00, 0.12, 'sine', 0.12);
        } else if (type === 'repeat') {
          playTone(ctx, 659.25, 0.00, 0.09, 'sine', 0.12);
          playTone(ctx, 783.99, 0.08, 0.16, 'sine', 0.14);
        }
      } catch (e) {
        console.warn('Earcon play error:', e);
      }
    }

    function splitWordSyllables(word) {
      const clean = word.toLowerCase().trim();
      if (SYLLABLE_DICT[clean]) return SYLLABLE_DICT[clean];
      if (clean.length <= 3) return [word];

      const suffixes = [
        { re: /(ing)$/i, split: 3 },
        { re: /(tion|sion)$/i, split: 4 },
        { re: /(ment)$/i, split: 4 },
        { re: /(ness)$/i, split: 4 },
        { re: /(ful)$/i, split: 3 },
        { re: /(less)$/i, split: 4 },
        { re: /(able|ible)$/i, split: 4 },
        { re: /([td]ed)$/i, split: 2 },
        { re: /(er)$/i, split: 2 },
        { re: /(est)$/i, split: 3 },
        { re: /(ly)$/i, split: 2 }
      ];

      let stem = word;
      let suf = '';
      for (const s of suffixes) {
        if (s.re.test(stem) && stem.length > s.split + 2) {
          suf = stem.slice(-s.split);
          stem = stem.slice(0, -s.split);
          break;
        }
      }

      let parts = [];
      const doubleCons = stem.match(/([^aeiouy])\1/i);
      if (doubleCons && doubleCons.index > 0 && doubleCons.index + 2 < stem.length) {
        const splitPoint = doubleCons.index + 1;
        parts = [stem.slice(0, splitPoint), stem.slice(splitPoint)];
      } else {
        const vccv = stem.match(/([aeiouy])([^aeiouy]{2})([aeiouy])/i);
        if (vccv && vccv.index !== undefined) {
          const splitPoint = vccv.index + 2;
          parts = [stem.slice(0, splitPoint), stem.slice(splitPoint)];
        } else {
          const vcv = stem.match(/([aeiouy])([^aeiouy])([aeiouy])/i);
          if (vcv && vcv.index !== undefined && vcv.index > 0) {
            const splitPoint = vcv.index + 1;
            parts = [stem.slice(0, splitPoint), stem.slice(splitPoint)];
          } else {
            parts = [stem];
          }
        }
      }

      if (suf) parts.push(suf);
      return parts.filter(Boolean);
    }

    function getSyllables(phrase) {
      if (!phrase) return '';
      const cleanPhrase = phrase.toLowerCase().trim();
      if (SYLLABLE_DICT[cleanPhrase]) return SYLLABLE_DICT[cleanPhrase].join(' · ');
      const words = phrase.trim().split(/\s+/);
      const allSyllables = [];
      for (const w of words) {
        allSyllables.push(...splitWordSyllables(w));
      }
      return allSyllables.join(' · ');
    }

        const spanLow = document.createElement('span');
        spanLow.className = isAlpha ? 'letter-glyph' : '';
        if (isAlpha) spanLow.dataset.charIdx = thisIdx;
        spanLow.textContent = lowerLetters[i];
        lowerEl.appendChild(spanLow);

    function beginSpeakingLock() {

    function endSpeakingLock(seq) {
      if (seq !== speechPlaybackSeq) return;
      clearTimeout(speechWatchdogTimer);
      activeUtterance = null;
      clearTimeout(speechCooldownTimer);

      // Wait 750ms after utterance completes so room reverb / Bluetooth buffer doesn't feed back into mic
      speechCooldownTimer = setTimeout(() => {
        if (seq !== speechPlaybackSeq) return;
        isSpeaking = false;
        speechDetected = false;
        resetAudioBuffers();
        if (isSpeechEnabled && !isRecognizing && recognition) {
          startRecognition();
        }
      }, 750);
    }

    function scheduleSpeechWatchdog(seq, waitMs, startedAt, onDone) {
      clearTimeout(speechWatchdogTimer);
      speechWatchdogTimer = setTimeout(() => {
        if (seq !== speechPlaybackSeq) return;
        const elapsed = Date.now() - startedAt;
        // Never declare speech finished while browser speechSynthesis is actively speaking (up to 45s safety ceiling)
        if ('speechSynthesis' in window && window.speechSynthesis.speaking && elapsed < 45000) {
          scheduleSpeechWatchdog(seq, 1500, startedAt, onDone);
        } else {
          onDone();
        }
      }, waitMs);
    }

    // Pronounce spelling with letter-by-letter follow-along highlighting
    function speakWord(word) {
      const mySeq = ++speechPlaybackSeq;
      beginSpeakingLock();
      clearLetterHighlights();

      if (!('speechSynthesis' in window) || !word) {
        endSpeakingLock(mySeq);
        return;
      }

      window.speechSynthesis.cancel();

      const rate = getSpeechRate();
      const chosenVoice = getBestVoice();
      const cleanLetters = word.replace(/[^A-Za-z0-9]/g, '');
      const totalLetters = cleanLetters.length;

      let fullSpeechText = "";
      const letterCharMap = [];

      if (!isPhonicsMode) {
        const wordParts = word.trim().split(/\s+/);
        const spelledOut = wordParts
          .map(w => w.split('').join(', '))
          .join('. ');

        const prefix = `${word} is spelled `;
        fullSpeechText = `${prefix}${spelledOut}.`;

        let searchStart = prefix.length;
        for (let idx = 0; idx < totalLetters; idx++) {
          const letterChar = cleanLetters[idx];
          const foundPos = fullSpeechText.toUpperCase().indexOf(letterChar.toUpperCase(), searchStart);
          if (foundPos !== -1) {
            letterCharMap.push({ charIdx: idx, start: foundPos });
            searchStart = foundPos + 1;
          }
        }
      } else {
        for (let i = 0; i < totalLetters; i++) {
          const ch = cleanLetters[i].toLowerCase();
          const sound = PHONICS_SOUNDS[ch] || ch;
          const segment = `${cleanLetters[i].toUpperCase()} says ${sound}`;
          const segStart = fullSpeechText.length;
          fullSpeechText += (fullSpeechText ? '. ' : '') + segment;
          letterCharMap.push({ charIdx: i, start: segStart });
        }
        const letterSummary = cleanLetters.toUpperCase().split('').join(', ');
        fullSpeechText += `. ${letterSummary} spells ${word}.`;
      }

      const utterance = new SpeechSynthesisUtterance(fullSpeechText);
      activeUtterance = utterance; // Keep strong global reference to prevent Chrome GC bug
      if (chosenVoice) utterance.voice = chosenVoice;

      utterance.volume = 1.0;
      utterance.rate = rate;
      utterance.pitch = 1.0;

      let hasBoundaryTriggered = false;
      if (!isPhonicsMode) {
        const leadInMs = Math.max(700, Math.round(((`${word} is spelled `).length * 64) / rate));
        const perLetterMs = Math.round(520 / rate);
        for (let k = 0; k < totalLetters; k++) {
          const timer = setTimeout(() => {
            if (mySeq === speechPlaybackSeq && !hasBoundaryTriggered) {
              highlightLetterAtIndex(k);
            }
          }, leadInMs + (k * perLetterMs));
          letterHighlightTimers.push(timer);
        }
      } else {
        const perSegmentMs = Math.round(1400 / rate);
        for (let k = 0; k < totalLetters; k++) {
          const timer = setTimeout(() => {
            if (mySeq === speechPlaybackSeq && !hasBoundaryTriggered) {
              highlightLetterAtIndex(k);
            }
          }, k * perSegmentMs);
          letterHighlightTimers.push(timer);
        }
      }

      utterance.onboundary = (event) => {
        if (mySeq !== speechPlaybackSeq) return;
        if (typeof event.charIndex === 'number' && letterCharMap.length > 0) {
          for (let m = letterCharMap.length - 1; m >= 0; m--) {
            if (event.charIndex >= letterCharMap[m].start) {
              hasBoundaryTriggered = true;
              highlightLetterAtIndex(letterCharMap[m].charIdx);
              break;
            }
          }
        }
      };

      utterance.onstart = () => {
        if (mySeq === speechPlaybackSeq) isSpeaking = true;
      };

      let finished = false;
      const finishWordSpeech = () => {
        if (finished || mySeq !== speechPlaybackSeq) return;
        finished = true;
        clearLetterHighlights();
        flashAllLetters();
        endSpeakingLock(mySeq);
      };

      const initialWait = Math.max(5000, Math.round((fullSpeechText.length * 220) / rate) + 2500);
      scheduleSpeechWatchdog(mySeq, initialWait, Date.now(), finishWordSpeech);

      utterance.onend = finishWordSpeech;
      utterance.onerror = finishWordSpeech;

      console.log(`Speaking (${isPhonicsMode ? 'phonics' : 'letters'} @ ${rate}x):`, chosenVoice ? chosenVoice.name : "default", fullSpeechText);
      window.speechSynthesis.speak(utterance);
    }

    function TTS(text) {
      const mySeq = ++speechPlaybackSeq;
      beginSpeakingLock();
      clearLetterHighlights();

      if (!('speechSynthesis' in window) || !text) {
        endSpeakingLock(mySeq);
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      activeUtterance = utterance;
      const chosenVoice = getBestVoice();
      if (chosenVoice) utterance.voice = chosenVoice;

      utterance.volume = 1.0;
      utterance.rate = getSpeechRate();
      utterance.pitch = 1.0;

      utterance.onstart = () => {
        if (mySeq === speechPlaybackSeq) isSpeaking = true;
      };

      let finished = false;
      const finishSpeaking = () => {
        if (finished || mySeq !== speechPlaybackSeq) return;
        finished = true;
        endSpeakingLock(mySeq);
      };

      const initialWait = Math.max(4000, Math.round((text.length * 160) / utterance.rate) + 2000);
      scheduleSpeechWatchdog(mySeq, initialWait, Date.now(), finishSpeaking);

      utterance.onend = finishSpeaking;
      utterance.onerror = finishSpeaking;

      window.speechSynthesis.speak(utterance);
    }

    function handleRepeatClick() {
      if (!currentWord || currentWord.toUpperCase() === "NO") return;
      const mySeq = ++speechPlaybackSeq;
      beginSpeakingLock();
      playEarcon('repeat');
      setTimeout(() => {
        if (mySeq !== speechPlaybackSeq) return;
        speakWord(currentWord);
      }, 180);
    }

    // Profanity Filter: Fast local kid-safe check + Vector API fallback
    const LOCAL_PROFANITY = new Set([
      'poop', 'poopy', 'poopoo', 'pee', 'peeing', 'fart', 'farting',
      'crap', 'crappy', 'butt', 'boob', 'boobs', 'damn', 'hell',
      'shit', 'fuck', 'fucking', 'bitch', 'ass', 'asshole', 'bastard',
      'dick', 'piss', 'cunt'
    ]);

    async function checkIsProfane(text) {
      const clean = text.toLowerCase().trim();
      if (LOCAL_PROFANITY.has(clean)) return true;
      const parts = clean.split(/\s+/);
      for (const p of parts) {
        if (LOCAL_PROFANITY.has(p)) return true;
      }

      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 900);
        const res = await fetch('https://vector.profanity.dev', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: "Spell " + clean }),
          signal: controller.signal
        });
        clearTimeout(timeout);
        if (res.ok) {
          const data = await res.json();
          return !!data.isProfanity;
        }
      } catch (err) {
        console.warn('Profanity API lookup error:', err);
      }
      return false;
    }

    // Speech UI & Monkey Indicator Management (🐵 listening / 🙉 unmatched / 🙊 muted)
    function setIcon(icon, promptMessage, isError = false) {
      clearTimeout(resetIconTimer);
      if (!speechToggle) return;

      speechToggle.textContent = icon;
      if (promptText) {
        promptText.classList.toggle('status-error', isError);
      }

      if (icon === '🐵') {
        speechToggle.title = "Speech mode ON — click to turn off";
        speechToggle.setAttribute('aria-label', 'Speech mode ON');
        if (promptText) {
          promptText.textContent = promptMessage || 'Say "Spell ______"';
        }
      } else if (icon === '🙊') {
        speechToggle.title = "Speech mode OFF — click to turn on";
        speechToggle.setAttribute('aria-label', 'Speech mode OFF');
        if (promptText) {
          promptText.textContent = promptMessage || 'Speech mode is off — click 🙊 to listen';
        }
      } else if (icon === '🙉') {
        speechToggle.title = "Didn't catch 'Spell...' — try again";
        speechToggle.setAttribute('aria-label', "Didn't match spelling command");
        if (promptText) {
          promptText.textContent = promptMessage || 'Say "Spell [word]" — e.g. "Spell dog"';
        }

        resetIconTimer = setTimeout(() => {
          if (isSpeechEnabled && !isSpeaking) setIcon('🐵');
        }, 2500);
      }
    }

    // Process matched spelling word (race-free & immediately locks dictation during chimes/speech)
    async function handleSpellingMatch(rawWord) {
      const myMatchSeq = ++spellingMatchSeq;
      const mySpeechSeq = ++speechPlaybackSeq;
      beginSpeakingLock();

      let word = rawWord.trim();
      const lower = word.toLowerCase();
      if (lower === "eva") word = "aoife";
      else if (lower === "megan") word = "meaghan";

      const isBad = await checkIsProfane(word);
      if (myMatchSeq !== spellingMatchSeq) return;

      if (isBad) {
        setDisplayMode(false);
        upperEl.textContent = "NO";
        lowerEl.textContent = "no";
        clearLetterHighlights();
        updateSyllablesDisplay("");
        updateDestinationUrl("");
        resizeAll();
        setIcon('🙊', "Let's pick a different word", true);
        TTS("Let's pick a different word.");
        return;
      }

      // Render word immediately and start lookup in parallel so TTS is never stalled by slow image APIs
      renderWordLetters(word);
      updateSyllablesDisplay(word);
      updateDestinationUrl(word);

      if (!document.body.classList.contains('has-spelled')) {
        document.body.classList.add('has-spelled');
        setTimeout(resizeAll, 50);
        setTimeout(resizeAll, 460);
      }
      resizeAll();

      fetchIcon(word).then((iconUrl) => {
        if (myMatchSeq !== spellingMatchSeq) return;
        setDisplayMode(!!iconUrl, iconUrl, word);
      });

      playEarcon('match');
      setTimeout(() => {
        if (myMatchSeq !== spellingMatchSeq || mySpeechSeq !== speechPlaybackSeq) return;
        speakWord(word);
      }, 220);
    }

    function enableFirefoxMic() {
      if (loadingOverlay) loadingOverlay.style.display = 'none';
      if (isWakeLockEnabled) requestWakeLock();
      startFirefoxContinuousListening();
    }

    // Click handler for speechToggle: toggles speech mode on/off
    function handleIconClick() {
      playEarcon('toggle');
      if (isSpeechEnabled) {
        isSpeechEnabled = false;
        spellingMatchSeq++;
        speechPlaybackSeq++;
        clearTimeout(speechCooldownTimer);
        clearTimeout(speechWatchdogTimer);
        isSpeaking = false;
        speechDetected = false;
        activeUtterance = null;
        resetAudioBuffers();
        clearLetterHighlights();
        setIcon('🙊');
        if (recognition) stopRecognition();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      } else {
        isSpeechEnabled = true;
        setIcon('🐵');
        infoEl.textContent = '';
        if (isWakeLockEnabled) requestWakeLock();
        // Wait 240ms after toggle chime so chime does not trigger microphone
        setTimeout(() => {
          if (!isSpeechEnabled || isSpeaking) return;
          if (recognition) {
            startRecognition();
          } else {
            startFirefoxContinuousListening();
          }
        }, 240);
      }
    }

    // Strict extraction: ONLY trigger on "spell ____" (supporting 1-4 word phrases)
    function extractTargetWord(transcript) {
      if (!transcript || typeof transcript !== 'string') return null;

      // Reject self-speech echo phrasing
      if (/\bis\s+spelled\b|\bspells\b/i.test(transcript)) return null;

      const clean = transcript
        .replace(/[.,\/#!$%\^&\*;:{}=\_`~()?"'\x27]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      if (!clean) return null;

      const spellMatch = clean.match(/\bspell\b/i);
      if (!spellMatch) return null;

      const afterSpell = clean.slice(spellMatch.index + spellMatch[0].length).trim();
      if (!afterSpell) return null;

      const leadingFillerRegex = /^(?:out\s+|me\s+|us\s+|it\s+|for\s+me\s+|for\s+us\s+|the\s+words?\s+|this\s+words?\s+|words?\s+|the\s+|a\s+|an\s+)+/i;
      let candidate = afterSpell.replace(leadingFillerRegex, '').trim();

      const trailingFillerRegex = /(?:\s+(?:please|for\s+me|for\s+us|thank\s+you|thanks))+$/i;
      candidate = candidate.replace(trailingFillerRegex, '').trim();

      if (!candidate) return null;

      const stopWords = new Set([
        'the', 'a', 'an', 'word', 'words', 'it', 'that', 'this', 'me', 'you', 'i', 'we', 'us',
        'how', 'to', 'do', 'does', 'did', 'can', 'could', 'would', 'will', 'please',
        'spell', 'spelled', 'spelling', 'spells', 'what', 'is', 'for', 'of', 'out',
        'say', 'tell'
      ]);

      const words = candidate.split(/\s+/).filter(Boolean);
      if (words.length === 1 && stopWords.has(words[0].toLowerCase())) {
        return null;
      }

      const nonStopWords = words.filter(w => !stopWords.has(w.toLowerCase()));
      if (nonStopWords.length === 0) {
        return null;
      }

      if (words.length > 4) {
        candidate = words.slice(0, 4).join(' ');
      }

      return candidate;
    }

    function flattenFloat32Arrays(chunks) {
      let totalLength = 0;
      for (let i = 0; i < chunks.length; i++) totalLength += chunks[i].length;
      const flat = new Float32Array(totalLength);
      let offset = 0;
      for (let i = 0; i < chunks.length; i++) {
        flat.set(chunks[i], offset);
        offset += chunks[i].length;
      }
      return flat;
    }

    function resampleTo16k(audioData, origSampleRate) {
      if (!origSampleRate || origSampleRate === 16000) return audioData;
      const ratio = origSampleRate / 16000;
      const newLength = Math.round(audioData.length / ratio);
      const result = new Float32Array(newLength);
      let offsetResult = 0;
      let offsetBuffer = 0;
      while (offsetResult < result.length) {
        const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
        let accum = 0;
        let count = 0;
        for (let i = offsetBuffer; i < nextOffsetBuffer && i < audioData.length; i++) {
          accum += audioData[i];
          count++;
        }
        result[offsetResult] = count > 0 ? accum / count : audioData[offsetBuffer];
        offsetResult++;
        offsetBuffer = nextOffsetBuffer;
      }
      return result;
    }

    // Firefox continuous Voice Activity Detection (VAD)
    async function startFirefoxContinuousListening() {
      if (!isSpeechEnabled || isListeningFirefox) return;

      try {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }

        if (!mediaStream) {
          mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }

        if (!mediaStreamSource) {
          mediaStreamSource = audioContext.createMediaStreamSource(mediaStream);
          audioProcessor = audioContext.createScriptProcessor(4096, 1, 1);

          audioProcessor.onaudioprocess = (e) => {
            if (!isSpeechEnabled || isSpeaking || isProcessingFirefox) {
              resetAudioBuffers();
              return;
            }

            const channel = e.inputBuffer.getChannelData(0);

            let sumSquares = 0;
            for (let i = 0; i < channel.length; i++) {
              sumSquares += channel[i] * channel[i];
            }
            const rms = Math.sqrt(sumSquares / channel.length);

            const maxUtteranceChunks = Math.round(10 * audioContext.sampleRate / 4096);

            if (rms > 0.009) {
              if (!isSpeakingVoice) {
                isSpeakingVoice = true;
                silenceBuffers = 0;
                speechBuffer.push(...preSpeechRingBuffer);
                preSpeechRingBuffer = [];
              }
              silenceBuffers = 0;
              if (speechBuffer.length < maxUtteranceChunks) {
                speechBuffer.push(new Float32Array(channel));
              }
            } else if (isSpeakingVoice) {
              speechBuffer.push(new Float32Array(channel));
              silenceBuffers++;

              // ~1.0s of trailing silence adapts cleanly across hardware sample rates
              const chunksNeeded = Math.max(3, Math.round(1.0 * audioContext.sampleRate / 4096));
              if (silenceBuffers >= chunksNeeded || speechBuffer.length >= maxUtteranceChunks) {
                isSpeakingVoice = false;
                silenceBuffers = 0;
                const rawAudio = flattenFloat32Arrays(speechBuffer);
                resetAudioBuffers();

                const audio16k = resampleTo16k(rawAudio, audioContext.sampleRate);
                if (audio16k.length >= 8000) {
                  processFirefoxAudio(audio16k);
                }
              }
            } else {
              const maxPreRoll = Math.max(2, Math.round(0.45 * audioContext.sampleRate / 4096));
              preSpeechRingBuffer.push(new Float32Array(channel));
              if (preSpeechRingBuffer.length > maxPreRoll) {
                preSpeechRingBuffer.shift();
              }
            }
          };

          mediaStreamSource.connect(audioProcessor);
          audioProcessor.connect(audioContext.destination);
        }

        isListeningFirefox = true;
        setIcon('🐵');
      } catch (err) {
        console.warn("Firefox continuous mic setup failed:", err);
        infoEl.textContent = "Microphone permission needed — click the monkey to allow";
      }
    }

    async function processFirefoxAudio(float32Data) {
      if (isProcessingFirefox || isSpeaking || !isSpeechEnabled) return;
      isProcessingFirefox = true;

      try {
        if (!whisperPipeline) return;

        const out = await whisperPipeline(float32Data);
        if (isSpeaking || !isSpeechEnabled) return;

        const transcript = (out && out.text) ? out.text.trim() : '';
        console.log("Firefox Whisper transcript:", transcript);

        // Ignore common Whisper silence/noise hallucinations
        const bareLower = transcript.toLowerCase().replace(/[^a-z\s]/g, '').trim();
        const noiseHallucinations = new Set([
          '', 'you', 'thank you', 'thanks', 'thanks for watching',
          'bye', 'hmm', 'uh', 'um', 'blank audio', 'silence'
        ]);
        if (noiseHallucinations.has(bareLower) || /^\[.*\]$/.test(transcript) || /^\(.*\)$/.test(transcript)) {
          return;
        }

        if (/\bis\s+spelled\b|\bspells\b/i.test(transcript)) {
          return;
        }

        const targetWord = extractTargetWord(transcript);
        if (targetWord) {
          setIcon('🐵');
          await handleSpellingMatch(targetWord);
        } else {
          console.log("Speech did not match spelling command:", transcript);
          setIcon('🙉');
        }
      } catch (err) {
        console.error("Whisper VAD processing error:", err);
      } finally {
        isProcessingFirefox = false;
      }
    }

    // Initialize Firefox Whisper Engine by default
    async function initFirefoxWhisperEngine() {
      loadingOverlay.style.display = 'flex';
      progressBar.style.width = '0%';
      loadingStatus.textContent = 'Connecting to speech model...';

      try {
        const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
        env.allowLocalModels = false;
        if (env.backends?.onnx?.wasm) {
          env.backends.onnx.wasm.numThreads = 1;
        }

        const fileProgress = {};
        const ESTIMATED_TOTAL_BYTES = 41800000;
        let smoothedPct = 0;

        whisperPipeline = await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny.en', {
          progress_callback: (item) => {
            if (item.status === 'initiate') {
              if (smoothedPct === 0) {
                loadingStatus.textContent = 'Connecting to speech model...';
              }
            } else if (item.status === 'progress') {
              if (item.file && typeof item.loaded === 'number') {
                fileProgress[item.file] = item.loaded;
                const totalLoaded = Object.values(fileProgress).reduce((acc, bytes) => acc + bytes, 0);
                const calcPct = Math.min(98, Math.round((totalLoaded / ESTIMATED_TOTAL_BYTES) * 100));
                smoothedPct = Math.max(smoothedPct, calcPct);
                progressBar.style.width = smoothedPct + '%';
                loadingStatus.textContent = `Downloading speech engine (${smoothedPct}%)...`;
              }
            } else if (item.status === 'done') {
              if (item.file && item.total) {
                fileProgress[item.file] = item.total;
              }
            } else if (item.status === 'ready') {
              smoothedPct = Math.max(smoothedPct, 99);
              progressBar.style.width = smoothedPct + '%';
              loadingStatus.textContent = 'Initializing engine...';
            }
          }
        });

        progressBar.style.width = '100%';
        loadingStatus.textContent = 'Speech engine ready';

        startMicBtn.style.display = 'inline-flex';
        setTimeout(() => {
          if (loadingOverlay.style.display !== 'none') {
            startFirefoxContinuousListening();
            loadingOverlay.style.display = 'none';
          }
        }, 800);
      } catch (err) {
        console.error("Failed to load Whisper in Firefox:", err);
        loadingOverlay.style.display = 'none';
        setIcon('🙉', 'Speech engine error — click the monkey to retry', true);
        infoEl.textContent = 'Could not load speech engine — check connection and retry';
      }
    }

    // Native Web Speech API vs Firefox Whisper fallback
    const isFirefox = /firefox|fxios/i.test(navigator.userAgent);
    const hasWorkingNativeSpeech = !isFirefox && ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window);

    if (!hasWorkingNativeSpeech) {
      initFirefoxWhisperEngine();
    } else {
      const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognitionAPI();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        if (isSpeaking || !isSpeechEnabled) {
          pauseRecognition();
          return;
        }
        isRecognizing = true;
        console.log("Speech recognition active");
      };

      recognition.onspeechstart = () => {
        if (!isSpeaking && isSpeechEnabled) speechDetected = true;
      };
      recognition.onsoundstart = () => {
        if (!isSpeaking && isSpeechEnabled) speechDetected = true;
      };

      recognition.onresult = (event) => {
        if (isSpeaking || !isSpeechEnabled) {
          speechDetected = false;
          return;
        }

        const lastResult = event.results[event.results.length - 1];
        if (!lastResult || !lastResult[0]) return;

        const transcript = lastResult[0].transcript.trim();
        console.log("Heard transcript:", transcript);

        if (/\bis\s+spelled\b|\bspells\b/i.test(transcript)) {
          speechDetected = false;
          return;
        }

        const targetWord = extractTargetWord(transcript);
        if (targetWord) {
          speechDetected = false;
          setIcon('🐵');
          handleSpellingMatch(targetWord);
        } else {
          speechDetected = false;
          console.log("Speech did not match spelling command:", transcript);
          setIcon('🙉');
        }
      };

      recognition.onnomatch = () => {
        if (isSpeaking || !isSpeechEnabled) return;
        speechDetected = false;
        setIcon('🙉');
      };

      recognition.onerror = (event) => {
        if (event.error === 'aborted' || event.error === 'no-speech') {
          return;
        }
        console.warn("Speech recognition error:", event.error);
        if (event.error === 'network' || event.error === 'service-not-allowed') {
          console.warn("Native speech recognition unavailable, switching to Whisper engine...");
          recognition = null;
          initFirefoxWhisperEngine();
        } else if (event.error === 'not-allowed') {
          isSpeechEnabled = false;
          isRecognizing = false;
          setIcon('🙊');
          infoEl.textContent = "Microphone access blocked — allow access in browser settings and click 🙊";
        }
      };

      recognition.onend = () => {
        isRecognizing = false;

        if (speechDetected && !isSpeaking && isSpeechEnabled) {
          speechDetected = false;
          setIcon('🙉');
        }

        if (isSpeechEnabled && !isSpeaking) {
          setTimeout(() => {
            if (isSpeechEnabled && !isRecognizing && !isSpeaking) {
              startRecognition();
            }
          }, 300);
        }
      };

      startRecognition();
    }

    function startRecognition() {
      if (!recognition || !isSpeechEnabled || isRecognizing || isSpeaking) return;
      try {
        recognition.start();
      } catch (err) {
        console.warn("startRecognition caught error:", err);
      }
    }

    function pauseRecognition() {
      if (!recognition) return;
      isRecognizing = false;
      try {
        recognition.abort();
      } catch (err) {
        console.warn("pauseRecognition caught error:", err);
      }
    }

    function stopRecognition() {
      if (!recognition) return;
      isRecognizing = false;
      try {
        recognition.stop();
      } catch (err) {
        console.warn("stopRecognition caught error:", err);
      }
    }

    checkFullscreenSupport();
    requestWakeLock();
    initSpeedMode();
    initPhonicsMode();
    renderWordLetters("wonderful");
    updateSyllablesDisplay("wonderful");
    updateDestinationUrl("wonderful");

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          console.log('Service Worker registered with scope:', reg.scope);
        }).catch((err) => {
          console.warn('Service Worker registration failed:', err);
        });
      });
    }
  </script>
</body>

</html>
